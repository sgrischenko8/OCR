[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-text-pipeline"
version = "0.1.0"
description = "Детекція та розпізнавання тексту на відео з консолідацією подій"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless==4.10.0.84",
    "numpy==1.26.4",
    "easyocr==1.7.2",
]

[tool.setuptools.packages.find]
where = ["src"]
